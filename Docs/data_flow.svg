<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="460" fill="#f7f9fc"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2545">Data Flow — Source to Gold</text>

  <!-- column headers -->
  <text x="150" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a12">BRONZE</text>
  <text x="500" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2c3644">SILVER</text>
  <text x="850" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#6b5410">GOLD</text>

  <!-- Bronze nodes -->
  <g font-size="11" fill="#4a2e0a">
    <rect x="60" y="95"  width="180" height="28" rx="5" fill="#f4e3cf" stroke="#c98a3c"/><text x="150" y="113" text-anchor="middle">crm_cust_info</text>
    <rect x="60" y="133" width="180" height="28" rx="5" fill="#f4e3cf" stroke="#c98a3c"/><text x="150" y="151" text-anchor="middle">crm_prd_info</text>
    <rect x="60" y="171" width="180" height="28" rx="5" fill="#f4e3cf" stroke="#c98a3c"/><text x="150" y="189" text-anchor="middle">crm_sales_details</text>
    <rect x="60" y="209" width="180" height="28" rx="5" fill="#f4e3cf" stroke="#c98a3c"/><text x="150" y="227" text-anchor="middle">erp_CUST_AZ12</text>
    <rect x="60" y="247" width="180" height="28" rx="5" fill="#f4e3cf" stroke="#c98a3c"/><text x="150" y="265" text-anchor="middle">erp_LOC_A101</text>
    <rect x="60" y="285" width="180" height="28" rx="5" fill="#f4e3cf" stroke="#c98a3c"/><text x="150" y="303" text-anchor="middle">erp_PX_CAT_G1V2</text>
  </g>

  <!-- Silver nodes -->
  <g font-size="11" fill="#2c3644">
    <rect x="410" y="95"  width="180" height="28" rx="5" fill="#dfe4ea" stroke="#7c8798"/><text x="500" y="113" text-anchor="middle">crm_cust_info</text>
    <rect x="410" y="133" width="180" height="28" rx="5" fill="#dfe4ea" stroke="#7c8798"/><text x="500" y="151" text-anchor="middle">crm_prd_info</text>
    <rect x="410" y="171" width="180" height="28" rx="5" fill="#dfe4ea" stroke="#7c8798"/><text x="500" y="189" text-anchor="middle">crm_sales_details</text>
    <rect x="410" y="209" width="180" height="28" rx="5" fill="#dfe4ea" stroke="#7c8798"/><text x="500" y="227" text-anchor="middle">erp_CUST_AZ12</text>
    <rect x="410" y="247" width="180" height="28" rx="5" fill="#dfe4ea" stroke="#7c8798"/><text x="500" y="265" text-anchor="middle">erp_LOC_A101</text>
    <rect x="410" y="285" width="180" height="28" rx="5" fill="#dfe4ea" stroke="#7c8798"/><text x="500" y="303" text-anchor="middle">erp_PX_CAT_G1V2</text>
  </g>

  <!-- Gold nodes -->
  <g font-size="12" fill="#5c4a10" font-weight="600">
    <rect x="760" y="130" width="180" height="34" rx="6" fill="#fdf1cf" stroke="#c9a12b"/><text x="850" y="152" text-anchor="middle">dim_customers</text>
    <rect x="760" y="184" width="180" height="34" rx="6" fill="#fdf1cf" stroke="#c9a12b"/><text x="850" y="206" text-anchor="middle">dim_products</text>
    <rect x="760" y="238" width="180" height="34" rx="6" fill="#fdf1cf" stroke="#c9a12b"/><text x="850" y="260" text-anchor="middle">fact_sales</text>
  </g>

  <!-- bronze -> silver arrows (1:1 straight) -->
  <g stroke="#9aa5b5" stroke-width="1.5" marker-end="url(#arrow2)">
    <line x1="240" y1="109" x2="405" y2="109"/>
    <line x1="240" y1="147" x2="405" y2="147"/>
    <line x1="240" y1="185" x2="405" y2="185"/>
    <line x1="240" y1="223" x2="405" y2="223"/>
    <line x1="240" y1="261" x2="405" y2="261"/>
    <line x1="240" y1="299" x2="405" y2="299"/>
  </g>

  <!-- silver -> gold arrows -->
  <g stroke="#9aa5b5" stroke-width="1.5" marker-end="url(#arrow2)">
    <line x1="590" y1="109" x2="755" y2="147"/>
    <line x1="590" y1="223" x2="755" y2="147"/>
    <line x1="590" y1="261" x2="755" y2="147"/>

    <line x1="590" y1="147" x2="755" y2="201"/>
    <line x1="590" y1="299" x2="755" y2="201"/>

    <line x1="590" y1="185" x2="755" y2="255"/>
    <line x1="590" y1="147" x2="755" y2="255"/>
    <line x1="590" y1="109" x2="755" y2="255"/>
  </g>

  <text x="500" y="400" text-anchor="middle" font-size="12" fill="#8a95a5">Guided Project — built by following Data With Baraa's SQL Data Warehouse course</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#9aa5b5"/>
    </marker>
  </defs>
</svg>
