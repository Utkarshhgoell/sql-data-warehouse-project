<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="560" fill="#f7f9fc"/>

  <text x="500" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#0b2545">Data Architecture — Medallion (Bronze · Silver · Gold)</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" fill="#5b6b82">SQL Server Data Warehouse | CRM &amp; ERP Source Systems</text>

  <!-- Source systems -->
  <rect x="30" y="120" width="150" height="70" rx="10" fill="#ffffff" stroke="#8aa0bd" stroke-width="1.5"/>
  <text x="105" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2545">CRM System</text>
  <text x="105" y="170" text-anchor="middle" font-size="11" fill="#5b6b82">3 CSV files</text>

  <rect x="30" y="220" width="150" height="70" rx="10" fill="#ffffff" stroke="#8aa0bd" stroke-width="1.5"/>
  <text x="105" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2545">ERP System</text>
  <text x="105" y="270" text-anchor="middle" font-size="11" fill="#5b6b82">3 CSV files</text>

  <!-- Arrows to bronze -->
  <line x1="180" y1="155" x2="245" y2="220" stroke="#8aa0bd" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="255" x2="245" y2="230" stroke="#8aa0bd" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bronze layer -->
  <rect x="250" y="120" width="220" height="330" rx="14" fill="#f4e3cf" stroke="#c98a3c" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#7a4a12">BRONZE</text>
  <text x="360" y="170" text-anchor="middle" font-size="11" fill="#7a4a12">Raw, as-is</text>

  <rect x="270" y="190" width="180" height="34" rx="6" fill="#ffffff" stroke="#c98a3c"/>
  <text x="360" y="212" text-anchor="middle" font-size="12" fill="#4a2e0a">crm_cust_info</text>
  <rect x="270" y="234" width="180" height="34" rx="6" fill="#ffffff" stroke="#c98a3c"/>
  <text x="360" y="256" text-anchor="middle" font-size="12" fill="#4a2e0a">crm_prd_info</text>
  <rect x="270" y="278" width="180" height="34" rx="6" fill="#ffffff" stroke="#c98a3c"/>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#4a2e0a">crm_sales_details</text>
  <rect x="270" y="322" width="180" height="34" rx="6" fill="#ffffff" stroke="#c98a3c"/>
  <text x="360" y="344" text-anchor="middle" font-size="12" fill="#4a2e0a">erp_CUST_AZ12</text>
  <rect x="270" y="366" width="180" height="34" rx="6" fill="#ffffff" stroke="#c98a3c"/>
  <text x="360" y="388" text-anchor="middle" font-size="12" fill="#4a2e0a">erp_LOC_A101</text>
  <rect x="270" y="410" width="180" height="34" rx="6" fill="#ffffff" stroke="#c98a3c"/>
  <text x="360" y="432" text-anchor="middle" font-size="12" fill="#4a2e0a">erp_PX_CAT_G1V2</text>

  <!-- Arrow bronze -> silver -->
  <line x1="470" y1="285" x2="530" y2="285" stroke="#5b6b82" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="272" text-anchor="middle" font-size="10" fill="#5b6b82">cleanse</text>

  <!-- Silver layer -->
  <rect x="535" y="120" width="220" height="330" rx="14" fill="#dfe4ea" stroke="#7c8798" stroke-width="2"/>
  <text x="645" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3644">SILVER</text>
  <text x="645" y="170" text-anchor="middle" font-size="11" fill="#2c3644">Cleansed &amp; standardized</text>

  <rect x="555" y="190" width="180" height="34" rx="6" fill="#ffffff" stroke="#7c8798"/>
  <text x="645" y="212" text-anchor="middle" font-size="12" fill="#2c3644">crm_cust_info</text>
  <rect x="555" y="234" width="180" height="34" rx="6" fill="#ffffff" stroke="#7c8798"/>
  <text x="645" y="256" text-anchor="middle" font-size="12" fill="#2c3644">crm_prd_info</text>
  <rect x="555" y="278" width="180" height="34" rx="6" fill="#ffffff" stroke="#7c8798"/>
  <text x="645" y="300" text-anchor="middle" font-size="12" fill="#2c3644">crm_sales_details</text>
  <rect x="555" y="322" width="180" height="34" rx="6" fill="#ffffff" stroke="#7c8798"/>
  <text x="645" y="344" text-anchor="middle" font-size="12" fill="#2c3644">erp_CUST_AZ12</text>
  <rect x="555" y="366" width="180" height="34" rx="6" fill="#ffffff" stroke="#7c8798"/>
  <text x="645" y="388" text-anchor="middle" font-size="12" fill="#2c3644">erp_LOC_A101</text>
  <rect x="555" y="410" width="180" height="34" rx="6" fill="#ffffff" stroke="#7c8798"/>
  <text x="645" y="432" text-anchor="middle" font-size="12" fill="#2c3644">erp_PX_CAT_G1V2</text>

  <!-- Arrow silver -> gold -->
  <line x1="755" y1="285" x2="815" y2="285" stroke="#5b6b82" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="785" y="272" text-anchor="middle" font-size="10" fill="#5b6b82">model</text>

  <!-- Gold layer -->
  <rect x="820" y="150" width="150" height="270" rx="14" fill="#fdf1cf" stroke="#c9a12b" stroke-width="2"/>
  <text x="895" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#6b5410">GOLD</text>
  <text x="895" y="198" text-anchor="middle" font-size="11" fill="#6b5410">Star schema</text>

  <rect x="838" y="215" width="114" height="40" rx="6" fill="#ffffff" stroke="#c9a12b"/>
  <text x="895" y="240" text-anchor="middle" font-size="12" fill="#5c4a10">dim_customers</text>
  <rect x="838" y="265" width="114" height="40" rx="6" fill="#ffffff" stroke="#c9a12b"/>
  <text x="895" y="290" text-anchor="middle" font-size="12" fill="#5c4a10">dim_products</text>
  <rect x="838" y="315" width="114" height="40" rx="6" fill="#ffffff" stroke="#c9a12b"/>
  <text x="895" y="340" text-anchor="middle" font-size="12" fill="#5c4a10">fact_sales</text>

  <text x="500" y="500" text-anchor="middle" font-size="12" fill="#8a95a5">Guided Project — built by following Data With Baraa's SQL Data Warehouse course</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6b82"/>
    </marker>
  </defs>
</svg>
