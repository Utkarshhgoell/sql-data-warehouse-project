<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="520" fill="#f7f9fc"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2545">Gold Layer — Star Schema</text>

  <!-- Fact table (center) -->
  <rect x="340" y="210" width="220" height="240" rx="10" fill="#0b2545" stroke="#0b2545"/>
  <text x="450" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">fact_sales</text>
  <line x1="352" y1="248" x2="548" y2="248" stroke="#ffffff" stroke-opacity="0.4"/>
  <text x="360" y="268" font-size="11.5" fill="#dbe6f5">order_number</text>
  <text x="360" y="288" font-size="11.5" fill="#dbe6f5">product_key (FK)</text>
  <text x="360" y="308" font-size="11.5" fill="#dbe6f5">customer_key (FK)</text>
  <text x="360" y="328" font-size="11.5" fill="#dbe6f5">order_date</text>
  <text x="360" y="348" font-size="11.5" fill="#dbe6f5">shipping_date</text>
  <text x="360" y="368" font-size="11.5" fill="#dbe6f5">due_date</text>
  <text x="360" y="388" font-size="11.5" fill="#dbe6f5">sales_amount</text>
  <text x="360" y="408" font-size="11.5" fill="#dbe6f5">quantity</text>
  <text x="360" y="428" font-size="11.5" fill="#dbe6f5">price</text>

  <!-- dim_customers (left) -->
  <rect x="40" y="90" width="230" height="230" rx="10" fill="#ffffff" stroke="#3f7cac" stroke-width="2"/>
  <rect x="40" y="90" width="230" height="34" rx="10" fill="#3f7cac"/>
  <text x="155" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">dim_customers</text>
  <text x="55" y="146" font-size="11.5" fill="#22364a">customer_key (PK)</text>
  <text x="55" y="166" font-size="11.5" fill="#22364a">customer_id</text>
  <text x="55" y="186" font-size="11.5" fill="#22364a">customer_number</text>
  <text x="55" y="206" font-size="11.5" fill="#22364a">firstname / lastname</text>
  <text x="55" y="226" font-size="11.5" fill="#22364a">country</text>
  <text x="55" y="246" font-size="11.5" fill="#22364a">marital_status</text>
  <text x="55" y="266" font-size="11.5" fill="#22364a">birthdate</text>
  <text x="55" y="286" font-size="11.5" fill="#22364a">gender</text>
  <text x="55" y="306" font-size="11.5" fill="#22364a">create_date</text>

  <!-- dim_products (right) -->
  <rect x="630" y="90" width="230" height="230" rx="10" fill="#ffffff" stroke="#3f7cac" stroke-width="2"/>
  <rect x="630" y="90" width="230" height="34" rx="10" fill="#3f7cac"/>
  <text x="745" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">dim_products</text>
  <text x="645" y="146" font-size="11.5" fill="#22364a">product_key (PK)</text>
  <text x="645" y="166" font-size="11.5" fill="#22364a">product_id</text>
  <text x="645" y="186" font-size="11.5" fill="#22364a">product_number</text>
  <text x="645" y="206" font-size="11.5" fill="#22364a">product_name</text>
  <text x="645" y="226" font-size="11.5" fill="#22364a">category / subcategory</text>
  <text x="645" y="246" font-size="11.5" fill="#22364a">maintenance</text>
  <text x="645" y="266" font-size="11.5" fill="#22364a">cost</text>
  <text x="645" y="286" font-size="11.5" fill="#22364a">product_line</text>
  <text x="645" y="306" font-size="11.5" fill="#22364a">start_date</text>

  <!-- connectors -->
  <line x1="270" y1="205" x2="340" y2="270" stroke="#3f7cac" stroke-width="2.5"/>
  <line x1="630" y1="205" x2="560" y2="270" stroke="#3f7cac" stroke-width="2.5"/>

  <text x="450" y="490" text-anchor="middle" font-size="12" fill="#8a95a5">Guided Project — built by following Data With Baraa's SQL Data Warehouse course</text>
</svg>
